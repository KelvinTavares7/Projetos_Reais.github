<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="To-do_list.css">
    <title>To-do list</title>
</head>
<body>
    <header>
        <h1>To-do list</h1>
        <h3>Qual tarefa você precisa realizar hoje?</h3>
    </header>

    <main>
        <div id="botoes">
            <button id="Criar-Tarefa">Criar Tarefa</button>
            <button id="Tarefas">Tarefas</button>
        </div>

        <div id="container"></div>
        <ul id="listaTarefas"></ul>
    </main>

    <button id="Salvar">Salvar</button> <!-- botão fora, mas será movido via JS -->

    <script src="To-do_list.js"></script>
</body>
</html>
